<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12361f" />
    <title>Swing Golf</title>
    <style>
      :root {
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        color: #f4f8f2;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 0%, #2f7a3f, #10301c 70%);
        padding: 16px;
        box-sizing: border-box;
      }
      main {
        max-width: 720px;
        width: 100%;
        text-align: center;
      }
      h1 {
        font-size: clamp(2.5rem, 9vw, 4.5rem);
        margin: 0;
      }
      h1 span {
        color: #ffd54a;
      }
      p {
        color: #b7cbb9;
        font-size: 1.15rem;
      }
      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 28px;
      }
      a.choice {
        display: block;
        padding: 26px 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        color: inherit;
        text-decoration: none;
        border: 2px solid rgba(255, 255, 255, 0.15);
      }
      a.choice:hover,
      a.choice.suggested {
        border-color: #ffd54a;
      }
      a.choice b {
        display: block;
        font-size: 1.5rem;
        margin: 8px 0 4px;
      }
      .emoji {
        font-size: 2.8rem;
      }
      @media (max-width: 560px) {
        .choices {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Swing <span>Golf</span></h1>
      <p>A living-room golf game. The big screen shows the course – every player's phone becomes their club.</p>
      <div class="choices">
        <a class="choice" id="tv" href="display.html">
          <div class="emoji">📺</div>
          <b>Big screen</b>
          <span>Open on a laptop / TV browser, then cast or screen-share it to the TV.</span>
        </a>
        <a class="choice" id="phone" href="controller.html">
          <div class="emoji">📱</div>
          <b>Phone controller</b>
          <span>Join with the 4-letter code on the TV and swing your phone.</span>
        </a>
      </div>
    </main>
    <script>
      const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
      document.getElementById(mobile ? "phone" : "tv").classList.add("suggested");
    </script>
  </body>
</html>
