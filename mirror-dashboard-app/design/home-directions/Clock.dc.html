<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: oklch(0.8 0.12 70); }
    a:hover { color: oklch(0.88 0.1 70); }
    .outfit { font-family: "Outfit", "Century Gothic", "Segoe UI", sans-serif; }
    p { margin: 0; }
    svg { flex-shrink: 0; }
    @keyframes breathe { from { opacity: 0; } to { opacity: 1; } }
    .fade { animation: breathe 1100ms ease-out both; }
  </style>
</helmet>
<div class="outfit" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; box-sizing: border-box; padding: 100px 116px; display: flex; align-items: center; gap: 96px; background: {{c.ground}}; color: {{c.digits}};">

  <div class="fade" style="flex-grow: 1; display: flex; flex-direction: column; gap: 22px;">
    <p style="font-size: 380px; font-weight: 200; line-height: 0.78; letter-spacing: -0.05em;">9:51</p>
    <p style="font-size: 38px; font-weight: 300; color: {{c.muted}};">Friday, September 11</p>
  </div>

  <div class="fade" style="width: 640px; flex-shrink: 0; display: flex; flex-direction: column; gap: 52px; padding-left: 70px; border-left: 1px solid {{c.rule}}; animation-delay: 250ms;">

    <div style="display: flex; align-items: center; gap: 28px;">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="{{c.accent}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <p style="font-size: 72px; font-weight: 300; line-height: 0.95;">72°</p>
        <p style="font-size: 25px; font-weight: 300; color: {{c.muted}};">Clear, high of 80°</p>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 28px;">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="{{c.accent}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <p style="font-size: 72px; font-weight: 300; line-height: 0.95;">9–11</p>
        <p style="font-size: 25px; font-weight: 300; color: {{c.muted}};">Plumber tomorrow morning</p>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 28px;">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="{{c.accent}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a2 2 0 0 0 4 0V3M8 12v9M17 3c-1.7 1-2.5 3-2.5 5.5V13H17v8"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <p style="font-size: 72px; font-weight: 300; line-height: 0.95;">25 min</p>
        <p style="font-size: 25px; font-weight: 300; color: {{c.muted}};">Creamy tomato pasta tonight</p>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 18px; padding-top: 6px;">
      <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; border: 2px solid {{c.accent}};"></span>
      <p style="font-size: 28px; font-weight: 400;">Wash Ella's cleats before bed</p>
    </div>
  </div>

  <p style="position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; font-size: 19px; font-weight: 300; letter-spacing: 0.08em; color: {{c.muted}};">Tap for everything else</p>
</div>
</x-dc>
<script data-dc-script data-props='{"night":{"editor":"boolean","default":false},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const night = this.props.night ?? false;
    const c = night ? {
      ground: 'oklch(0.09 0.012 30)',
      digits: 'oklch(0.56 0.17 28)',
      muted: 'oklch(0.44 0.11 28)',
      accent: 'oklch(0.56 0.17 28)',
      rule: 'oklch(0.56 0.17 28 / 0.18)'
    } : {
      ground: 'oklch(0.19 0.018 55)',
      digits: 'oklch(0.94 0.03 75)',
      muted: 'oklch(0.72 0.03 65)',
      accent: 'oklch(0.8 0.12 70)',
      rule: 'oklch(1 0 0 / 0.09)'
    };
    return { c };
  }
}
</script>
</body>
</html>
