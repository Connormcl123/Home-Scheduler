# qBittorrent behind a Gluetun VPN container (kill switch: qBittorrent's only
# network is the VPN tunnel). Copy .env.example to .env and fill in your key.
#
#   cd ~/Home-Scheduler/config/torrent && cp .env.example .env && nano .env
#   docker compose up -d
services:
  gluetun:
    image: qmcgaw/gluetun
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on
    ports:
      - 8081:8081 # qBittorrent web UI (LAN only; do not port-forward on the router)
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    network_mode: "service:gluetun"
    environment: [PUID=1000, PGID=1000, WEBUI_PORT=8081]
    volumes:
      - ./qbt-config:/config
      - ${MEDIA_ROOT:-/srv/media}/Downloads:/downloads
    depends_on: [gluetun]
    restart: unless-stopped
